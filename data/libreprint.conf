[libreprint]
# Configure HP USB printers automatically when they are plugged in (true/false).
usb = true
# Network printers found by mDNS: "add" creates a queue automatically, "off" disables it.
network = add
# Setting this to true accepts HP's proprietary plugin license on behalf of ALL users of this
# machine, so the plugin is downloaded automatically. Leave it false to be asked instead.
accept_hp_plugin_license = false
# Allow libreprint to install missing packages with apt-get (true/false).
install_packages = true
