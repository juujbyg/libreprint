[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libreprint"
dynamic = ["version"]
description = "Set up any printer or scanner on Debian/Ubuntu with one command, and print, scan and check ink"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = []

[project.scripts]
libreprint = "libreprint.cli:main"

[tool.setuptools.dynamic]
version = {attr = "libreprint.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
